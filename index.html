        // ============================================
        // APP STATE

        let allPrompts = PROMPTS_DATA;
        let filteredPrompts = PROMPTS_DATA;
        let currentModal = null;
        let categories = [...new Set(PROMPTS_DATA.map(p => p.category))];

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', function () {
            populateCategoryFilter();
            updateStats();
            renderPrompts();
            attachEventListeners();
        });

        function populateCategoryFilter() {
            const categoryFilter = document.getElementById('category-filter');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categoryFilter.appendChild(option);
            });
        }

        function updateStats() {
            document.getElementById('total-prompts').textContent = PROMPTS_DATA.length;
            document.getElementById('total-categories').textContent = categories.length;
        }

        function attachEventListeners() {
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('category-filter').addEventListener('change', applyFilters);
            document.getElementById('model-filter').addEventListener('change', applyFilters);
            document.getElementById('difficulty-filter').addEventListener('change', applyFilters);

            // Close modal on outside click
            window.addEventListener('click', function (e) {
                const modal = document.getElementById('prompt-modal');
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && currentModal) {
                    closeModal();
                }
            });
        }

        // ============================================
        // FILTERING & SEARCH
        // ============================================

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const categoryFilter = document.getElementById('category-filter').value;
            const modelFilter = document.getElementById('model-filter').value;
            const difficultyFilter = document.getElementById('difficulty-filter').value;

            filteredPrompts = allPrompts.filter(prompt => {
                const matchesSearch = searchTerm === '' ||
                    prompt.title.toLowerCase().includes(searchTerm) ||
                    prompt.text.toLowerCase().includes(searchTerm) ||
                    prompt.category.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryFilter || prompt.category === categoryFilter;
                const matchesModel = !modelFilter || prompt.model === modelFilter;
                const matchesDifficulty = !difficultyFilter || prompt.difficulty === difficultyFilter;

                return matchesSearch && matchesCategory && matchesModel && matchesDifficulty;
            });

            updateResultsInfo();
            renderPrompts();
        }

        function updateResultsInfo() {
            const info = document.getElementById('results-info');
            const count = filteredPrompts.length;
            info.textContent = `Found ${count} prompt${count !== 1 ? 's' : ''}`;
        }

        // ============================================
        // RENDERING
        // ============================================

        function renderPrompts() {
            const container = document.getElementById('prompts-container');
            const emptyState = document.getElementById('empty-state');

            if (filteredPrompts.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = filteredPrompts.map(prompt => `
    <div class="prompt-card">
        <div class="prompt-category">${prompt.category}</div>
        <div class="prompt-title">${prompt.title}</div>
        <div class="prompt-text">${prompt.text.substring(0, 150)}...</div>
        <div class="prompt-meta">
            <span>▪ ${prompt.model}</span>
            <span>◊ ${prompt.difficulty}</span>
        </div>
        <div class="prompt-actions">
            <button class="btn btn-copy" onclick="copyPrompt(${prompt.id})">▸ Copy</button>
            <button class="btn btn-view" onclick="viewPrompt(${prompt.id})">○ View</button>
        </div>
    </div>
    `).join('');
        }

        // ============================================
        // ACTIONS
        // ============================================

        function copyPrompt(promptId) {
            const prompt = PROMPTS_DATA.find(p => p.id === promptId);
            if (!prompt) return;

            navigator.clipboard.writeText(prompt.text).then(() => {
                // Visual feedback
                const buttons = document.querySelectorAll('.btn-copy');
                buttons.forEach(btn => {
                    if (btn.onclick.toString().includes(promptId)) {
                        btn.classList.add('copied');
                        btn.textContent = '✅ Copied!';
                        setTimeout(() => {
                            btn.classList.remove('copied');
                            btn.textContent = '📋 Copy';
                        }, 2000);
                    }
                });
            }).catch(err => {
                alert('Failed to copy. Please try again.');
                console.error('Copy failed:', err);
            });
        }

        function viewPrompt(promptId) {
            const prompt = PROMPTS_DATA.find(p => p.id === promptId);
            if (!prompt) return;

            document.getElementById('modal-title').textContent = prompt.title;
            document.getElementById('modal-text').textContent = prompt.text;
            document.getElementById('prompt-modal').classList.add('active');
            currentModal = prompt.id;
        }

        function closeModal() {
            document.getElementById('prompt-modal').classList.remove('active');
            currentModal = null;
        }

        function copyFromModal() {
            const text = document.getElementById('modal-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Prompt copied to clipboard!');
                closeModal();
            }).catch(err => {
                alert('Failed to copy. Please try again.');
                console.error('Copy failed:', err);
            });
        }

        function sortBy(type) {
            // Update active button
            document.querySelectorAll('.btn-toolbar').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (type === 'newest') {
                filteredPrompts.sort((a, b) => b.id - a.id);
            } else if (type === 'popular') {
                filteredPrompts.sort((a, b) => a.id - b.id);
            }
            renderPrompts();
        }

        function exportAll() {
            const csv = filteredPrompts.map(p => {
                const title = p.title.replace(/"/g, '""');
                const category = p.category.replace(/"/g, '""');
                const model = p.model.replace(/"/g, '""');
                const difficulty = p.difficulty.replace(/"/g, '""');
                const text = p.text.replace(/"/g, '""').replace(/\n/g, ' ');
                return `"${title}","${category}","${model}","${difficulty}","${text}"`;
            }).join('\n');

            const header = '"Title","Category","AI Model","Difficulty","Prompt Text"\n';
            const fullCSV = header + csv;

            const blob = new Blob([fullCSV], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `promptflow-prompts-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
